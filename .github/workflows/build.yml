name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build application
        run: dotnet build src/DesktopClock/DesktopClock.csproj --configuration Release --nologo

      - name: Build test executable
        run: dotnet build tests/DesktopClock.Core.Tests/DesktopClock.Core.Tests.csproj --configuration Release --nologo

      - name: Run tests
        run: dotnet run --project tests/DesktopClock.Core.Tests/DesktopClock.Core.Tests.csproj --configuration Release --no-build --no-restore
